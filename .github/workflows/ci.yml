name: CI

on:
  push:
    branches: ["**"]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (pytest + ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Instalar
        run: pip install -e "backend[dev]"
      - name: Lint
        run: ruff check backend/src backend/tests
      - name: Testes
        # Nenhum teste toca a rede, manda e-mail ou chama LLM.
        run: pytest backend/tests -q

  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  conformidade:
    name: Conformidade (robots.txt e LGPD)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e "backend[dev]"
      - name: Requisitos não negociáveis da seção 11
        # Job separado de propósito: se alguém afrouxar robots.txt ou a
        # minimização de dados pessoais, o CI aponta o dedo para o requisito,
        # não para "um teste qualquer quebrou".
        run: |
          pytest backend/tests/test_http.py -q
          pytest backend/tests/test_ingestao.py -q -k "lgpd"
          pytest backend/tests/test_extracao.py -q -k "llm or evidencia"
