# Ambiente de desenvolvimento com Postgres e Redis.
# Para rodar só o essencial, o padrão (SQLite + fila em memória) não precisa de
# nada disto: veja o README.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports: ["5432:5432"]
    volumes: ["dados_postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U radar"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      RADAR_DATABASE_URL: postgresql+psycopg://radar:radar@postgres:5432/radar
      RADAR_FILA_BACKEND: redis
      RADAR_REDIS_URL: redis://redis:6379/0
      # Troque por um contato real antes de coletar site de terceiro.
      RADAR_USER_AGENT: "RadarLeilaoBot/0.1 (+https://exemplo.org; contato@exemplo.org)"
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    volumes: ["dados_coleta:/app/data"]

volumes:
  dados_postgres:
  dados_coleta:
